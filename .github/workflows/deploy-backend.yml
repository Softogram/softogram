name: Deploy Backend

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
  workflow_dispatch:

concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Set up deploy SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.BACKEND_DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Pinned host key (ssh-keyscan 18.61.153.149) instead of disabling host
          # checking - this is a deploy key with shell access to prod, MITM matters.
          cat >> ~/.ssh/known_hosts <<'EOF'
          18.61.153.149 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIOS1x0EaJgqdaWTuwMnysAYt20WbgCzV3RgNGus2ltJD
          EOF

      - name: Deploy to EC2 with health-check rollback
        run: |
          ssh -i ~/.ssh/deploy_key ec2-user@18.61.153.149 'bash -s' <<'REMOTE'
          set -e
          cd /home/ec2-user/softogram
          PREV_COMMIT=$(git rev-parse HEAD)
          git fetch origin main
          git reset --hard origin/main

          cd backend
          source venv/bin/activate
          pip install -r requirements.txt
          # Idempotent - server.py also runs this at boot, but running it explicitly
          # here means a bad migration fails loudly in the CI log with its own step,
          # instead of surfacing only as a confusing post-restart health-check failure.
          alembic upgrade head
          cd ..

          sudo systemctl restart softogram-backend.service
          sleep 3

          if curl -sf http://127.0.0.1:8001/api/ > /dev/null; then
            echo "Health check passed"
            exit 0
          fi

          echo "Health check FAILED - rolling back to $PREV_COMMIT"
          git reset --hard "$PREV_COMMIT"
          cd backend
          pip install -r requirements.txt
          cd ..
          sudo systemctl restart softogram-backend.service
          sleep 3

          if curl -sf http://127.0.0.1:8001/api/ > /dev/null; then
            echo "Rolled back successfully - service is back on the previous commit"
          else
            echo "ROLLBACK ALSO FAILED - service may be down, manual intervention required"
          fi
          exit 1
          REMOTE
