# Local Postgres for development (issue #31).
# Matches the version planned for RDS later (docs/growth/phase-10-platform-plan-2026-08.md)
# so the eventual cutover is a data copy, not a schema rewrite.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: softogram
      POSTGRES_PASSWORD: softogram
      POSTGRES_DB: softogram
    ports:
      # Default stays 5432 so it matches backend/database.py, alembic.ini and
      # production. Do not change this default to work around a local conflict -
      # the code defaults are what the EC2 host actually connects with, and
      # moving them took the production API down until the deploy's health check
      # rolled it back.
      #
      # If another project already holds 5432 on your machine, override it
      # locally instead - nothing shared changes:
      #
      #   echo 'POSTGRES_HOST_PORT=5433' >> .env          # compose reads this
      #   # then point backend/.env at the same port:
      #   DATABASE_URL=postgresql+asyncpg://softogram:softogram@localhost:5433/softogram
      #
      # The conflict is worth recognising because the symptom is misleading: the
      # container reports healthy while every connection reaches the *other*
      # server and fails with "password authentication failed for user
      # softogram" - a role that does not exist over there.
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U softogram"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
