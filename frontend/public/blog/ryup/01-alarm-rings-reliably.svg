<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" role="img" aria-labelledby="t d" font-family="system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
<title id="t">How a Ryup alarm rings</title><desc id="d">The alarm is handed to the phone&#x27;s own alarm system, which rings even if the app is closed. Opening the activity and reading aloud stops it, and a missed alarm is retried.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#FA5E41"/></marker></defs>
<rect width="960" height="420" rx="16" fill="#FFF3EA"/>
<rect x="30" y="150" width="160" height="90" rx="12" fill="#FBE3D6" stroke="#C9604A" stroke-width="2"/>
<text x="110.0" y="190.25" text-anchor="middle" font-size="15" font-weight="700" fill="#22110C">Alarm saved</text>
<text x="110.0" y="210.25" text-anchor="middle" font-size="15" font-weight="400" fill="#22110C">in the Ryup app</text>
<rect x="250" y="60" width="230" height="100" rx="12" fill="#FFFFFF" stroke="#C9604A" stroke-width="2"/>
<text x="365.0" y="95.25" text-anchor="middle" font-size="15" font-weight="700" fill="#22110C">iPhone: AlarmKit</text>
<text x="365.0" y="115.25" text-anchor="middle" font-size="15" font-weight="400" fill="#22110C">rings through Silent</text>
<text x="365.0" y="135.25" text-anchor="middle" font-size="15" font-weight="400" fill="#22110C">mode and Focus</text>
<rect x="250" y="200" width="230" height="100" rx="12" fill="#FFFFFF" stroke="#C9604A" stroke-width="2"/>
<text x="365.0" y="235.25" text-anchor="middle" font-size="15" font-weight="700" fill="#22110C">Android: exact alarm</text>
<text x="365.0" y="255.25" text-anchor="middle" font-size="15" font-weight="400" fill="#22110C">full-screen alert</text>
<text x="365.0" y="275.25" text-anchor="middle" font-size="15" font-weight="400" fill="#22110C">alarm sound service</text>
<rect x="540" y="125" width="190" height="100" rx="12" fill="#FBE3D6" stroke="#C9604A" stroke-width="2"/>
<text x="635.0" y="160.25" text-anchor="middle" font-size="15" font-weight="700" fill="#22110C">The alarm rings</text>
<text x="635.0" y="180.25" text-anchor="middle" font-size="15" font-weight="400" fill="#22110C">even if the app</text>
<text x="635.0" y="200.25" text-anchor="middle" font-size="15" font-weight="400" fill="#22110C">is closed</text>
<rect x="780" y="125" width="150" height="100" rx="12" fill="#FA5E41" stroke="#22110C" stroke-width="2"/>
<text x="855.0" y="160.25" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">Read aloud,</text>
<text x="855.0" y="180.25" text-anchor="middle" font-size="15" font-weight="400" fill="#FFFFFF">answer a question</text>
<text x="855.0" y="200.25" text-anchor="middle" font-size="15" font-weight="400" fill="#FFFFFF">= alarm stops</text>
<line x1="190" y1="175" x2="250" y2="110" stroke="#FA5E41" stroke-width="2.5" marker-end="url(#a)"/>
<line x1="190" y1="215" x2="250" y2="250" stroke="#FA5E41" stroke-width="2.5" marker-end="url(#a)"/>
<line x1="480" y1="110" x2="540" y2="160" stroke="#FA5E41" stroke-width="2.5" marker-end="url(#a)"/>
<line x1="480" y1="250" x2="540" y2="190" stroke="#FA5E41" stroke-width="2.5" marker-end="url(#a)"/>
<line x1="730" y1="175" x2="780" y2="175" stroke="#FA5E41" stroke-width="2.5" marker-end="url(#a)"/>
<rect x="540" y="300" width="390" height="70" rx="12" fill="#FBE3D6" stroke="#C9604A" stroke-width="2" stroke-dasharray="6 5"/>
<text x="735.0" y="330.4" text-anchor="middle" font-size="14" font-weight="400" fill="#22110C">Nobody started the activity?</text>
<text x="735.0" y="349.4" text-anchor="middle" font-size="14" font-weight="400" fill="#22110C">Our backend notices and the alarm rings again</text>
<line x1="855" y1="225" x2="855" y2="300" stroke="#FA5E41" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#a)"/>
<text x="883.0" y="262.5" text-anchor="middle" font-size="13" fill="#6B4A40">missed</text>
<text x="480" y="32" text-anchor="middle" font-size="16" font-weight="700" fill="#22110C">One idea, two different phone systems</text>
</svg>