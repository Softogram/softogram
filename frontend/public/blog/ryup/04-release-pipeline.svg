<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 400" width="980" height="400" role="img" aria-labelledby="t d" font-family="system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
<title id="t">From merge to live server</title><desc id="d">Merging to main builds a container image tagged with the commit, pushes it to a registry, deploys it through a managed command channel with no stored keys, then checks health and runs smoke tests.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#FA5E41"/></marker></defs>
<rect width="980" height="400" rx="16" fill="#FFF3EA"/>
<rect x="20" y="60" width="140" height="90" rx="12" fill="#FBE3D6" stroke="#C9604A" stroke-width="2"/>
<text x="90.0" y="100.25" text-anchor="middle" font-size="15" font-weight="700" fill="#22110C">Merge to</text>
<text x="90.0" y="120.25" text-anchor="middle" font-size="15" font-weight="400" fill="#22110C">main</text>
<line x1="160" y1="105" x2="180" y2="105" stroke="#FA5E41" stroke-width="2.5" marker-end="url(#a)"/>
<rect x="180" y="60" width="140" height="90" rx="12" fill="#FBE3D6" stroke="#C9604A" stroke-width="2"/>
<text x="250.0" y="100.25" text-anchor="middle" font-size="15" font-weight="700" fill="#22110C">GitHub Actions</text>
<text x="250.0" y="120.25" text-anchor="middle" font-size="15" font-weight="400" fill="#22110C">runs the checks</text>
<line x1="320" y1="105" x2="340" y2="105" stroke="#FA5E41" stroke-width="2.5" marker-end="url(#a)"/>
<rect x="340" y="60" width="140" height="90" rx="12" fill="#FA5E41" stroke="#22110C" stroke-width="2"/>
<text x="410.0" y="100.25" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">Build image</text>
<text x="410.0" y="120.25" text-anchor="middle" font-size="15" font-weight="400" fill="#FFFFFF">tag = commit ID</text>
<line x1="480" y1="105" x2="500" y2="105" stroke="#FA5E41" stroke-width="2.5" marker-end="url(#a)"/>
<rect x="500" y="60" width="140" height="90" rx="12" fill="#FBE3D6" stroke="#C9604A" stroke-width="2"/>
<text x="570.0" y="100.25" text-anchor="middle" font-size="15" font-weight="700" fill="#22110C">Registry</text>
<text x="570.0" y="120.25" text-anchor="middle" font-size="15" font-weight="400" fill="#22110C">stores the image</text>
<line x1="640" y1="105" x2="660" y2="105" stroke="#FA5E41" stroke-width="2.5" marker-end="url(#a)"/>
<rect x="660" y="60" width="140" height="90" rx="12" fill="#FBE3D6" stroke="#C9604A" stroke-width="2"/>
<text x="730.0" y="100.25" text-anchor="middle" font-size="15" font-weight="700" fill="#22110C">Deploy command</text>
<text x="730.0" y="120.25" text-anchor="middle" font-size="15" font-weight="400" fill="#22110C">no SSH, no keys</text>
<line x1="800" y1="105" x2="820" y2="105" stroke="#FA5E41" stroke-width="2.5" marker-end="url(#a)"/>
<rect x="820" y="60" width="140" height="90" rx="12" fill="#FBE3D6" stroke="#C9604A" stroke-width="2"/>
<text x="890.0" y="100.25" text-anchor="middle" font-size="15" font-weight="700" fill="#22110C">Server</text>
<text x="890.0" y="120.25" text-anchor="middle" font-size="15" font-weight="400" fill="#22110C">pulls, restarts</text>
<rect x="380" y="230" width="220" height="80" rx="12" fill="#FFFFFF" stroke="#C9604A" stroke-width="2"/>
<text x="490.0" y="265.25" text-anchor="middle" font-size="15" font-weight="700" fill="#22110C">Health check</text>
<text x="490.0" y="285.25" text-anchor="middle" font-size="15" font-weight="400" fill="#22110C">/readyz answers?</text>
<rect x="640" y="230" width="300" height="80" rx="12" fill="#FFFFFF" stroke="#C9604A" stroke-width="2"/>
<text x="790.0" y="265.25" text-anchor="middle" font-size="15" font-weight="700" fill="#22110C">Smoke tests</text>
<text x="790.0" y="285.25" text-anchor="middle" font-size="15" font-weight="400" fill="#22110C">can a person really have a morning?</text>
<line x1="880" y1="150" x2="540" y2="230" stroke="#FA5E41" stroke-width="2.5" marker-end="url(#a)"/>
<line x1="600" y1="270" x2="640" y2="270" stroke="#FA5E41" stroke-width="2.5" marker-end="url(#a)"/>
<rect x="40" y="230" width="300" height="80" rx="12" fill="#FBE3D6" stroke="#C9604A" stroke-width="2" stroke-dasharray="6 5"/>
<text x="190.0" y="265.25" text-anchor="middle" font-size="15" font-weight="700" fill="#22110C">Something wrong?</text>
<text x="190.0" y="285.25" text-anchor="middle" font-size="15" font-weight="400" fill="#22110C">Deploy an older tag. No rebuild.</text>
<line x1="380" y1="270" x2="340" y2="270" stroke="#FA5E41" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#a)"/>
<text x="490" y="360" text-anchor="middle" font-size="14" font-weight="700" fill="#22110C">Releases only happen when we merge to main, on purpose</text>
</svg>