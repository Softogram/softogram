<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 430" width="980" height="430" role="img" aria-labelledby="t d" font-family="system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
<title id="t">How a subscription purchase reaches Ryup</title><desc id="d">The app buys through the store. The store tells RevenueCat. RevenueCat sends a signed message to the Ryup backend, which records the plan. The app then reads its plan from the backend.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#FA5E41"/></marker></defs>
<rect width="980" height="430" rx="16" fill="#FFF3EA"/>
<rect x="30" y="160" width="150" height="90" rx="12" fill="#FFFFFF" stroke="#C9604A" stroke-width="2"/>
<text x="105.0" y="200.25" text-anchor="middle" font-size="15" font-weight="700" fill="#22110C">Ryup app</text>
<text x="105.0" y="220.25" text-anchor="middle" font-size="15" font-weight="400" fill="#22110C">taps Choose plan</text>
<rect x="250" y="60" width="190" height="80" rx="12" fill="#FFFFFF" stroke="#C9604A" stroke-width="2"/>
<text x="345.0" y="95.25" text-anchor="middle" font-size="15" font-weight="700" fill="#22110C">App Store</text>
<text x="345.0" y="115.25" text-anchor="middle" font-size="15" font-weight="400" fill="#22110C">or Google Play</text>
<rect x="250" y="260" width="190" height="80" rx="12" fill="#FBE3D6" stroke="#C9604A" stroke-width="2"/>
<text x="345.0" y="295.25" text-anchor="middle" font-size="15" font-weight="700" fill="#22110C">RevenueCat</text>
<text x="345.0" y="315.25" text-anchor="middle" font-size="15" font-weight="400" fill="#22110C">checks the purchase</text>
<rect x="520" y="260" width="190" height="80" rx="12" fill="#FA5E41" stroke="#22110C" stroke-width="2"/>
<text x="615.0" y="295.25" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">Signed webhook</text>
<text x="615.0" y="315.25" text-anchor="middle" font-size="15" font-weight="400" fill="#FFFFFF">proves it is real</text>
<rect x="780" y="260" width="170" height="80" rx="12" fill="#FFFFFF" stroke="#C9604A" stroke-width="2"/>
<text x="865.0" y="295.25" text-anchor="middle" font-size="15" font-weight="700" fill="#22110C">Ryup backend</text>
<text x="865.0" y="315.25" text-anchor="middle" font-size="15" font-weight="400" fill="#22110C">saves the plan</text>
<rect x="780" y="60" width="170" height="80" rx="12" fill="#FBE3D6" stroke="#C9604A" stroke-width="2"/>
<text x="865.0" y="95.25" text-anchor="middle" font-size="15" font-weight="700" fill="#22110C">Ryup app</text>
<text x="865.0" y="115.25" text-anchor="middle" font-size="15" font-weight="400" fill="#22110C">shows your plan</text>
<line x1="180" y1="185" x2="250" y2="110" stroke="#FA5E41" stroke-width="2.5" marker-end="url(#a)"/>
<text x="193.0" y="143.5" text-anchor="middle" font-size="13" fill="#6B4A40">buy</text>
<line x1="345" y1="140" x2="345" y2="260" stroke="#FA5E41" stroke-width="2.5" marker-end="url(#a)"/>
<text x="345.0" y="192.0" text-anchor="middle" font-size="13" fill="#6B4A40">receipt</text>
<line x1="440" y1="300" x2="520" y2="300" stroke="#FA5E41" stroke-width="2.5" marker-end="url(#a)"/>
<line x1="710" y1="300" x2="780" y2="300" stroke="#FA5E41" stroke-width="2.5" marker-end="url(#a)"/>
<line x1="865" y1="260" x2="865" y2="140" stroke="#FA5E41" stroke-width="2.5" marker-end="url(#a)"/>
<text x="795.0" y="200.0" text-anchor="middle" font-size="13" fill="#6B4A40">app asks for its plan</text>
<text x="490" y="400" text-anchor="middle" font-size="13" font-weight="700" fill="#22110C">Who is buying? The app tells RevenueCat the Ryup account ID, so the backend can match it</text>
</svg>