<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" role="img" aria-labelledby="t d" font-family="system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
<title id="t">What the scoring pipeline does when something fails</title><desc id="d">Each kind of failure has its own treatment: rate limits are held without spending an attempt, bad keys are held, permanent errors give up and compensate, ordinary errors retry with growing waits, and a spending ceiling stops runaway mornings.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#FA5E41"/></marker></defs>
<rect width="1000" height="470" rx="16" fill="#FFF3EA"/>
<text x="500" y="30" text-anchor="middle" font-size="16" font-weight="700" fill="#22110C">Every kind of failure gets its own answer</text>
<rect x="20" y="170" width="170" height="100" rx="12" fill="#FA5E41" stroke="#22110C" stroke-width="2"/>
<text x="105.0" y="215.25" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">Attempt fails</text>
<text x="105.0" y="235.25" text-anchor="middle" font-size="15" font-weight="400" fill="#FFFFFF">one of five tries</text>
<rect x="260" y="60" width="230" height="66" rx="12" fill="#FFFFFF" stroke="#C9604A" stroke-width="2"/>
<text x="375.0" y="97.9" text-anchor="middle" font-size="14" font-weight="700" fill="#22110C">Vendor rate limit</text>
<rect x="530" y="60" width="440" height="66" rx="12" fill="#FBE3D6" stroke="#C9604A" stroke-width="2"/>
<text x="750.0" y="97.9" text-anchor="middle" font-size="14" font-weight="400" fill="#22110C">Hold. No attempt spent.</text>
<line x1="190" y1="220" x2="260" y2="93" stroke="#FA5E41" stroke-width="2.5" marker-end="url(#a)"/>
<line x1="490" y1="93" x2="530" y2="93" stroke="#FA5E41" stroke-width="2.5" marker-end="url(#a)"/>
<rect x="260" y="136" width="230" height="66" rx="12" fill="#FFFFFF" stroke="#C9604A" stroke-width="2"/>
<text x="375.0" y="173.9" text-anchor="middle" font-size="14" font-weight="700" fill="#22110C">Vendor rejects our key</text>
<rect x="530" y="136" width="440" height="66" rx="12" fill="#FBE3D6" stroke="#C9604A" stroke-width="2"/>
<text x="750.0" y="173.9" text-anchor="middle" font-size="14" font-weight="400" fill="#22110C">Hold 5 min. Fix key, still scores.</text>
<line x1="190" y1="220" x2="260" y2="169" stroke="#FA5E41" stroke-width="2.5" marker-end="url(#a)"/>
<line x1="490" y1="169" x2="530" y2="169" stroke="#FA5E41" stroke-width="2.5" marker-end="url(#a)"/>
<rect x="260" y="212" width="230" height="66" rx="12" fill="#FFFFFF" stroke="#C9604A" stroke-width="2"/>
<text x="375.0" y="249.9" text-anchor="middle" font-size="14" font-weight="700" fill="#22110C">Permanent error (bad audio)</text>
<rect x="530" y="212" width="440" height="66" rx="12" fill="#FBE3D6" stroke="#C9604A" stroke-width="2"/>
<text x="750.0" y="249.9" text-anchor="middle" font-size="14" font-weight="400" fill="#22110C">Give up now. Compensate a day.</text>
<line x1="190" y1="220" x2="260" y2="245" stroke="#FA5E41" stroke-width="2.5" marker-end="url(#a)"/>
<line x1="490" y1="245" x2="530" y2="245" stroke="#FA5E41" stroke-width="2.5" marker-end="url(#a)"/>
<rect x="260" y="288" width="230" height="66" rx="12" fill="#FFFFFF" stroke="#C9604A" stroke-width="2"/>
<text x="375.0" y="325.9" text-anchor="middle" font-size="14" font-weight="700" fill="#22110C">Ordinary error</text>
<rect x="530" y="288" width="440" height="66" rx="12" fill="#FBE3D6" stroke="#C9604A" stroke-width="2"/>
<text x="750.0" y="325.9" text-anchor="middle" font-size="14" font-weight="400" fill="#22110C">Retry: 30s, 2m, 8m, 30m + jitter</text>
<line x1="190" y1="220" x2="260" y2="321" stroke="#FA5E41" stroke-width="2.5" marker-end="url(#a)"/>
<line x1="490" y1="321" x2="530" y2="321" stroke="#FA5E41" stroke-width="2.5" marker-end="url(#a)"/>
<rect x="260" y="364" width="230" height="66" rx="12" fill="#FFFFFF" stroke="#C9604A" stroke-width="2"/>
<text x="375.0" y="401.9" text-anchor="middle" font-size="14" font-weight="700" fill="#22110C">Spend over $2 or 200 calls</text>
<rect x="530" y="364" width="440" height="66" rx="12" fill="#FBE3D6" stroke="#C9604A" stroke-width="2"/>
<text x="750.0" y="401.9" text-anchor="middle" font-size="14" font-weight="400" fill="#22110C">Stop. Compensate. Own reason code</text>
<line x1="190" y1="220" x2="260" y2="397" stroke="#FA5E41" stroke-width="2.5" marker-end="url(#a)"/>
<line x1="490" y1="397" x2="530" y2="397" stroke="#FA5E41" stroke-width="2.5" marker-end="url(#a)"/>
<rect x="20" y="440" width="960" height="24" rx="12" fill="#FBE3D6" stroke="#C9604A" stroke-width="2"/>
<text x="500.0" y="456.55" text-anchor="middle" font-size="13" font-weight="400" fill="#22110C">Our failure never costs you: after five spent attempts, you are compensated with a day</text>
</svg>