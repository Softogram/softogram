<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520" role="img" aria-labelledby="t d" font-family="system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
<title id="t">From a spoken morning to one score</title><desc id="d">Recordings are transcribed, checked by a moderation call, graded by an AI judge, turned into five components, combined, capped, reduced by a retry penalty, softened for newcomers, and saved with both a shown and a strict score.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#FA5E41"/></marker></defs>
<rect width="1000" height="520" rx="16" fill="#FFF3EA"/>
<text x="500" y="30" text-anchor="middle" font-size="16" font-weight="700" fill="#22110C">Scoring runs in the background, after you finish</text>
<rect x="20" y="70" width="150" height="80" rx="12" fill="#FFFFFF" stroke="#C9604A" stroke-width="2"/>
<text x="95.0" y="105.25" text-anchor="middle" font-size="15" font-weight="700" fill="#22110C">Your recordings</text>
<text x="95.0" y="125.25" text-anchor="middle" font-size="15" font-weight="400" fill="#22110C">uploaded to storage</text>
<rect x="210" y="70" width="150" height="80" rx="12" fill="#FBE3D6" stroke="#C9604A" stroke-width="2"/>
<text x="285.0" y="105.25" text-anchor="middle" font-size="15" font-weight="700" fill="#22110C">Queue</text>
<text x="285.0" y="125.25" text-anchor="middle" font-size="15" font-weight="400" fill="#22110C">a database column</text>
<rect x="400" y="70" width="170" height="80" rx="12" fill="#FFFFFF" stroke="#C9604A" stroke-width="2"/>
<text x="485.0" y="105.25" text-anchor="middle" font-size="15" font-weight="700" fill="#22110C">Speech to text</text>
<text x="485.0" y="125.25" text-anchor="middle" font-size="15" font-weight="400" fill="#22110C">words + timings</text>
<rect x="610" y="50" width="170" height="56" rx="12" fill="#FFFFFF" stroke="#C9604A" stroke-width="2"/>
<text x="695.0" y="73.4" text-anchor="middle" font-size="14" font-weight="700" fill="#22110C">Moderation call</text>
<text x="695.0" y="92.4" text-anchor="middle" font-size="14" font-weight="400" fill="#22110C">abuse check</text>
<rect x="610" y="114" width="170" height="56" rx="12" fill="#FFFFFF" stroke="#C9604A" stroke-width="2"/>
<text x="695.0" y="137.4" text-anchor="middle" font-size="14" font-weight="700" fill="#22110C">AI judge call</text>
<text x="695.0" y="156.4" text-anchor="middle" font-size="14" font-weight="400" fill="#22110C">4 rubric scores</text>
<rect x="820" y="70" width="160" height="80" rx="12" fill="#FA5E41" stroke="#22110C" stroke-width="2"/>
<text x="900.0" y="105.25" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">Pure scoring</text>
<text x="900.0" y="125.25" text-anchor="middle" font-size="15" font-weight="400" fill="#FFFFFF">package: no network</text>
<line x1="170" y1="110" x2="210" y2="110" stroke="#FA5E41" stroke-width="2.5" marker-end="url(#a)"/>
<line x1="360" y1="110" x2="400" y2="110" stroke="#FA5E41" stroke-width="2.5" marker-end="url(#a)"/>
<line x1="570" y1="100" x2="610" y2="80" stroke="#FA5E41" stroke-width="2.5" marker-end="url(#a)"/>
<line x1="570" y1="120" x2="610" y2="140" stroke="#FA5E41" stroke-width="2.5" marker-end="url(#a)"/>
<line x1="780" y1="110" x2="820" y2="110" stroke="#FA5E41" stroke-width="2.5" marker-end="url(#a)"/>
<rect x="20" y="230" width="185" height="70" rx="12" fill="#FBE3D6" stroke="#C9604A" stroke-width="2"/>
<text x="112.5" y="260.4" text-anchor="middle" font-size="14" font-weight="700" fill="#22110C">Word accuracy</text>
<text x="112.5" y="279.4" text-anchor="middle" font-size="14" font-weight="400" fill="#22110C">weight 22</text>
<rect x="215" y="230" width="185" height="70" rx="12" fill="#FBE3D6" stroke="#C9604A" stroke-width="2"/>
<text x="307.5" y="260.4" text-anchor="middle" font-size="14" font-weight="700" fill="#22110C">Response quality</text>
<text x="307.5" y="279.4" text-anchor="middle" font-size="14" font-weight="400" fill="#22110C">weight 28</text>
<rect x="410" y="230" width="185" height="70" rx="12" fill="#FBE3D6" stroke="#C9604A" stroke-width="2"/>
<text x="502.5" y="260.4" text-anchor="middle" font-size="14" font-weight="700" fill="#22110C">Liveliness</text>
<text x="502.5" y="279.4" text-anchor="middle" font-size="14" font-weight="400" fill="#22110C">weight 15</text>
<rect x="605" y="230" width="185" height="70" rx="12" fill="#FBE3D6" stroke="#C9604A" stroke-width="2"/>
<text x="697.5" y="260.4" text-anchor="middle" font-size="14" font-weight="700" fill="#22110C">Interaction</text>
<text x="697.5" y="279.4" text-anchor="middle" font-size="14" font-weight="400" fill="#22110C">weight 15</text>
<rect x="800" y="230" width="185" height="70" rx="12" fill="#FBE3D6" stroke="#C9604A" stroke-width="2"/>
<text x="892.5" y="260.4" text-anchor="middle" font-size="14" font-weight="700" fill="#22110C">Affirmation</text>
<text x="892.5" y="279.4" text-anchor="middle" font-size="14" font-weight="400" fill="#22110C">weight 20</text>
<line x1="900" y1="150" x2="900" y2="200" stroke="#FA5E41" stroke-width="2.5" marker-end="url(#a)"/>
<line x1="900" y1="200" x2="110" y2="200" stroke="#FA5E41" stroke-width="2.5" marker-end="url(#a)"/>
<line x1="112" y1="200" x2="112" y2="230" stroke="#FA5E41" stroke-width="2.5" marker-end="url(#a)"/>
<line x1="307" y1="200" x2="307" y2="230" stroke="#FA5E41" stroke-width="2.5" marker-end="url(#a)"/>
<line x1="502" y1="200" x2="502" y2="230" stroke="#FA5E41" stroke-width="2.5" marker-end="url(#a)"/>
<line x1="697" y1="200" x2="697" y2="230" stroke="#FA5E41" stroke-width="2.5" marker-end="url(#a)"/>
<line x1="892" y1="200" x2="892" y2="230" stroke="#FA5E41" stroke-width="2.5" marker-end="url(#a)"/>
<text x="500" y="194" text-anchor="middle" font-size="13" font-weight="400" fill="#6B4A40">measured at full or reduced confidence</text>
<rect x="20" y="350" width="230" height="70" rx="12" fill="#FFFFFF" stroke="#C9604A" stroke-width="2"/>
<text x="135.0" y="380.4" text-anchor="middle" font-size="14" font-weight="700" fill="#22110C">Weighted average</text>
<text x="135.0" y="399.4" text-anchor="middle" font-size="14" font-weight="400" fill="#22110C">only over what was measured</text>
<rect x="290" y="350" width="200" height="70" rx="12" fill="#FFFFFF" stroke="#C9604A" stroke-width="2"/>
<text x="390.0" y="380.4" text-anchor="middle" font-size="14" font-weight="700" fill="#22110C">Gates cap it</text>
<text x="390.0" y="399.4" text-anchor="middle" font-size="14" font-weight="400" fill="#22110C">affirmation, speech length</text>
<rect x="530" y="350" width="200" height="70" rx="12" fill="#FFFFFF" stroke="#C9604A" stroke-width="2"/>
<text x="630.0" y="380.4" text-anchor="middle" font-size="14" font-weight="700" fill="#22110C">Retry penalty</text>
<text x="630.0" y="399.4" text-anchor="middle" font-size="14" font-weight="400" fill="#22110C">5 points per extra ring</text>
<rect x="770" y="350" width="210" height="70" rx="12" fill="#FFFFFF" stroke="#C9604A" stroke-width="2"/>
<text x="875.0" y="380.4" text-anchor="middle" font-size="14" font-weight="700" fill="#22110C">Newcomer curve</text>
<text x="875.0" y="399.4" text-anchor="middle" font-size="14" font-weight="400" fill="#22110C">then abuse caps</text>
<line x1="250" y1="385" x2="290" y2="385" stroke="#FA5E41" stroke-width="2.5" marker-end="url(#a)"/>
<line x1="490" y1="385" x2="530" y2="385" stroke="#FA5E41" stroke-width="2.5" marker-end="url(#a)"/>
<line x1="730" y1="385" x2="770" y2="385" stroke="#FA5E41" stroke-width="2.5" marker-end="url(#a)"/>
<line x1="500" y1="300" x2="135" y2="350" stroke="#FA5E41" stroke-width="2.5" marker-end="url(#a)"/>
<rect x="250" y="455" width="500" height="50" rx="12" fill="#FA5E41" stroke="#22110C" stroke-width="2"/>
<text x="500.0" y="484.9" text-anchor="middle" font-size="14" font-weight="400" fill="#FFFFFF">Saved: shown score, strict score, tip, band, gates, version</text>
<line x1="875" y1="420" x2="750" y2="470" stroke="#FA5E41" stroke-width="2.5" marker-end="url(#a)"/>
</svg>