<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" width="1000" height="440" role="img" aria-labelledby="t d" font-family="system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
<title id="t">How a thumbs up fades</title><desc id="d">A thumbs up is worth 10 points. With a half-life of 30 days it is worth 5 after 30 days and 2.5 after 60 days. It drops under the favourite line of 3 after about 52 days of silence.</desc>
