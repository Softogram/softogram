<title id="t">Filling a drawn difficulty curve</title><desc id="d">A pool of measured boards, each with a difficulty score, is matched slot by slot to a drawn target curve with spikes and breathers. Each slot takes the nearest unused board within a tolerance; if none fits, assembly fails loudly rather than forcing one.</desc>
