<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" width="1000" height="330" role="img" aria-labelledby="t d" font-family="system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
<title id="t">The SpiceCraft level pipeline</title><desc id="d">Shuffle and deal a board, prove it solvable, find its proven minimum moves, set par and a move budget, let robot players of increasing strength measure its difficulty, add it to a pool, then fill a drawn difficulty curve by nearest score, and audit the result.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B5542A"/></marker></defs>
<rect width="1000" height="330" rx="16" fill="#FBF5EA"/>
<text x="500.0" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#22180F">From a random deal to a shipped level, all offline</text>
<rect x="20" y="62" width="220" height="96" rx="12" fill="#FFFFFF" stroke="#8A6A3A" stroke-width="2"/>
<text x="130.0" y="95.9" text-anchor="middle" font-size="14" font-weight="700" fill="#22180F">Shuffle and deal</text>
<text x="130.0" y="114.9" text-anchor="middle" font-size="14" font-weight="400" fill="#22180F">seeded, no jar</text>
<text x="130.0" y="133.9" text-anchor="middle" font-size="14" font-weight="400" fill="#22180F">starts complete</text>
<line x1="240" y1="110" x2="265" y2="110" stroke="#B5542A" stroke-width="2.5" marker-end="url(#a)"/>
<rect x="265" y="62" width="220" height="96" rx="12" fill="#FFFFFF" stroke="#8A6A3A" stroke-width="2"/>
<text x="375.0" y="95.9" text-anchor="middle" font-size="14" font-weight="700" fill="#22180F">Prove solvable</text>
<text x="375.0" y="114.9" text-anchor="middle" font-size="14" font-weight="400" fill="#22180F">depth-first search,</text>
<text x="375.0" y="133.9" text-anchor="middle" font-size="14" font-weight="400" fill="#22180F">2M position budget</text>
<line x1="485" y1="110" x2="510" y2="110" stroke="#B5542A" stroke-width="2.5" marker-end="url(#a)"/>
<rect x="510" y="62" width="220" height="96" rx="12" fill="#1F3223" stroke="#22180F" stroke-width="2"/>
<text x="620.0" y="95.9" text-anchor="middle" font-size="14" font-weight="700" fill="#FAF0DC">Proven minimum</text>
<text x="620.0" y="114.9" text-anchor="middle" font-size="14" font-weight="400" fill="#FAF0DC">deepen from a</text>
<text x="620.0" y="133.9" text-anchor="middle" font-size="14" font-weight="400" fill="#FAF0DC">lower bound</text>
<line x1="730" y1="110" x2="755" y2="110" stroke="#B5542A" stroke-width="2.5" marker-end="url(#a)"/>
<rect x="755" y="62" width="220" height="96" rx="12" fill="#FFFFFF" stroke="#8A6A3A" stroke-width="2"/>
<text x="865.0" y="95.9" text-anchor="middle" font-size="14" font-weight="700" fill="#22180F">Par and budget</text>
<text x="865.0" y="114.9" text-anchor="middle" font-size="14" font-weight="400" fill="#22180F">par = min + 2</text>
<text x="865.0" y="133.9" text-anchor="middle" font-size="14" font-weight="400" fill="#22180F">budget = par x 1.25 + extras</text>
<line x1="865" y1="158" x2="865" y2="196" stroke="#B5542A" stroke-width="2.5" marker-end="url(#a)"/>
<rect x="20" y="198" width="220" height="96" rx="12" fill="#1F3223" stroke="#22180F" stroke-width="2"/>
<text x="130.0" y="231.9" text-anchor="middle" font-size="14" font-weight="700" fill="#FAF0DC">Audit</text>
<text x="130.0" y="250.9" text-anchor="middle" font-size="14" font-weight="400" fill="#FAF0DC">re-prove every level,</text>
<text x="130.0" y="269.9" text-anchor="middle" font-size="14" font-weight="400" fill="#FAF0DC">check the curve</text>
<rect x="265" y="198" width="220" height="96" rx="12" fill="#FFFFFF" stroke="#8A6A3A" stroke-width="2"/>
<text x="375.0" y="231.9" text-anchor="middle" font-size="14" font-weight="700" fill="#22180F">Fill the curve</text>
<text x="375.0" y="250.9" text-anchor="middle" font-size="14" font-weight="400" fill="#22180F">nearest score per slot,</text>
<text x="375.0" y="269.9" text-anchor="middle" font-size="14" font-weight="400" fill="#22180F">fail loudly if none</text>
<line x1="265" y1="246" x2="240" y2="246" stroke="#B5542A" stroke-width="2.5" marker-end="url(#a)"/>
<rect x="510" y="198" width="220" height="96" rx="12" fill="#FFFFFF" stroke="#8A6A3A" stroke-width="2"/>
<text x="620.0" y="231.9" text-anchor="middle" font-size="14" font-weight="700" fill="#22180F">Pool</text>
<text x="620.0" y="250.9" text-anchor="middle" font-size="14" font-weight="400" fill="#22180F">thousands of measured</text>
<text x="620.0" y="269.9" text-anchor="middle" font-size="14" font-weight="400" fill="#22180F">candidates</text>
<line x1="510" y1="246" x2="485" y2="246" stroke="#B5542A" stroke-width="2.5" marker-end="url(#a)"/>
<rect x="755" y="198" width="220" height="96" rx="12" fill="#FFFFFF" stroke="#8A6A3A" stroke-width="2"/>
<text x="865.0" y="231.9" text-anchor="middle" font-size="14" font-weight="700" fill="#22180F">Robot ladder</text>
<text x="865.0" y="250.9" text-anchor="middle" font-size="14" font-weight="400" fill="#22180F">weakest robot that wins</text>
<text x="865.0" y="269.9" text-anchor="middle" font-size="14" font-weight="400" fill="#22180F">80% sets the tier</text>
<line x1="755" y1="246" x2="730" y2="246" stroke="#B5542A" stroke-width="2.5" marker-end="url(#a)"/>
<text x="500" y="318" text-anchor="middle" font-size="12" font-weight="400" fill="#22180F">Unprovable minimum, or nothing can win inside the budget: the board is dropped. Same seed, byte-identical output.</text>
</svg>
