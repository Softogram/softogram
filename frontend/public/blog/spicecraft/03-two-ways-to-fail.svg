<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" width="1000" height="360" role="img" aria-labelledby="t d" font-family="system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
<title id="t">Two ways a level can be lost</title><desc id="d">Out of moves is about the budget: the board can still be won, so the offer is five more moves, once per attempt. Stuck is about the board: no number of moves can win it, so the offers change the board instead: a spare jar, undo when it can reach a winnable board, or restart.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B5542A"/></marker></defs>
<rect width="1000" height="360" rx="16" fill="#FBF5EA"/>
<text x="500.0" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#22180F">Two ways to lose, two different answers</text>
<rect x="20" y="62" width="460" height="70" rx="12" fill="#1F3223" stroke="#22180F" stroke-width="2"/>
<text x="250.0" y="92.2" text-anchor="middle" font-size="15" font-weight="700" fill="#FAF0DC">Out of moves</text>
<text x="250.0" y="112.2" text-anchor="middle" font-size="15" font-weight="400" fill="#FAF0DC">the budget ran out; the board may still be winnable</text>
<rect x="520" y="62" width="460" height="70" rx="12" fill="#1F3223" stroke="#22180F" stroke-width="2"/>
<text x="750.0" y="92.2" text-anchor="middle" font-size="15" font-weight="700" fill="#FAF0DC">Stuck</text>
<text x="750.0" y="112.2" text-anchor="middle" font-size="15" font-weight="400" fill="#FAF0DC">no legal pour, or proven impossible to win</text>
<line x1="250" y1="132" x2="250" y2="160" stroke="#B5542A" stroke-width="2.5" marker-end="url(#a)"/>
<line x1="750" y1="132" x2="750" y2="160" stroke="#B5542A" stroke-width="2.5" marker-end="url(#a)"/>
<rect x="20" y="162" width="460" height="110" rx="12" fill="#FFFFFF" stroke="#8A6A3A" stroke-width="2"/>
<text x="250.0" y="193.4" text-anchor="middle" font-size="14" font-weight="700" fill="#22180F">Answer: more moves</text>
<text x="250.0" y="212.4" text-anchor="middle" font-size="14" font-weight="400" fill="#22180F">one video for 5 more moves,</text>
<text x="250.0" y="231.4" text-anchor="middle" font-size="14" font-weight="400" fill="#22180F">once per attempt;</text>
<text x="250.0" y="250.4" text-anchor="middle" font-size="14" font-weight="400" fill="#22180F">then restart or home</text>
<rect x="520" y="162" width="460" height="110" rx="12" fill="#FFFFFF" stroke="#8A6A3A" stroke-width="2"/>
<text x="750.0" y="193.4" text-anchor="middle" font-size="14" font-weight="700" fill="#22180F">Answer: change the board</text>
<text x="750.0" y="212.4" text-anchor="middle" font-size="14" font-weight="400" fill="#22180F">one spare jar, undo (only if it can</text>
<text x="750.0" y="231.4" text-anchor="middle" font-size="14" font-weight="400" fill="#22180F">reach a winnable board),</text>
<text x="750.0" y="250.4" text-anchor="middle" font-size="14" font-weight="400" fill="#22180F">restart or home</text>
<rect x="20" y="292" width="960" height="50" rx="12" fill="#F1E3C4" stroke="#8A6A3A" stroke-width="2"/>
<text x="500.0" y="321.9" text-anchor="middle" font-size="14" font-weight="700" fill="#22180F">Let the trap bite: a proven-lost board shows the Stuck sheet after 3 more pours. No legal pour at all: at once.</text>
</svg>
