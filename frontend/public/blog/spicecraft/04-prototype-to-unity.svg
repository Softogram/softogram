<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="1000" height="400" role="img" aria-labelledby="t d" font-family="system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
<title id="t">From the prototype to the Unity game</title><desc id="d">The SpiceCraft prototype, one HTML file, hands its tuned values to the Unity game. The rules go into a pure C# library tested without Unity; the look and motion go into a presentation layer tested in Play Mode and on the simulator. A dashed arrow says evidence can overrule the prototype.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B5542A"/></marker></defs>
<rect width="1000" height="400" rx="16" fill="#FBF5EA"/>
<text x="500.0" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#22180F">The prototype is the specification. Evidence can overrule it.</text>
<rect x="20" y="70" width="300" height="120" rx="12" fill="#1F3223" stroke="#22180F" stroke-width="2"/>
<text x="170.0" y="106.4" text-anchor="middle" font-size="14" font-weight="700" fill="#FAF0DC">Prototype</text>
<text x="170.0" y="125.4" text-anchor="middle" font-size="14" font-weight="400" fill="#FAF0DC">one HTML file, no build step</text>
<text x="170.0" y="144.4" text-anchor="middle" font-size="14" font-weight="400" fill="#FAF0DC">tuned timings, curves, colours</text>
<text x="170.0" y="163.4" text-anchor="middle" font-size="14" font-weight="400" fill="#FAF0DC">the values are the deliverable</text>
<rect x="380" y="62" width="600" height="66" rx="12" fill="#FFFFFF" stroke="#8A6A3A" stroke-width="2"/>
<text x="680.0" y="90.4" text-anchor="middle" font-size="14" font-weight="700" fill="#22180F">Core: the rules</text>
<text x="680.0" y="109.4" text-anchor="middle" font-size="14" font-weight="400" fill="#22180F">pure C#, cannot reference Unity, tested with dotnet test in seconds</text>
<rect x="380" y="140" width="600" height="66" rx="12" fill="#FFFFFF" stroke="#8A6A3A" stroke-width="2"/>
<text x="680.0" y="168.4" text-anchor="middle" font-size="14" font-weight="700" fill="#22180F">Game: what the player sees</text>
<text x="680.0" y="187.4" text-anchor="middle" font-size="14" font-weight="400" fill="#22180F">jars, the pour, sound, menus, ads; every feel value in an editable settings file</text>
<line x1="320" y1="110" x2="380" y2="95" stroke="#B5542A" stroke-width="2.5" marker-end="url(#a)"/>
<line x1="320" y1="150" x2="380" y2="173" stroke="#B5542A" stroke-width="2.5" marker-end="url(#a)"/>
<rect x="380" y="226" width="290" height="70" rx="12" fill="#F1E3C4" stroke="#8A6A3A" stroke-width="2"/>
<text x="525.0" y="256.4" text-anchor="middle" font-size="14" font-weight="700" fill="#22180F">Play Mode tests</text>
<text x="525.0" y="275.4" text-anchor="middle" font-size="14" font-weight="400" fill="#22180F">through the real touch raycast</text>
<rect x="690" y="226" width="290" height="70" rx="12" fill="#F1E3C4" stroke="#8A6A3A" stroke-width="2"/>
<text x="835.0" y="256.4" text-anchor="middle" font-size="14" font-weight="700" fill="#22180F">Simulator</text>
<text x="835.0" y="275.4" text-anchor="middle" font-size="14" font-weight="400" fill="#22180F">build, install, real taps, ~45 s</text>
<line x1="680" y1="206" x2="525" y2="226" stroke="#B5542A" stroke-width="2.5" marker-end="url(#a)"/>
<line x1="680" y1="206" x2="835" y2="226" stroke="#B5542A" stroke-width="2.5" marker-end="url(#a)"/>
<rect x="20" y="226" width="300" height="70" rx="12" fill="#FFFFFF" stroke="#8A6A3A" stroke-width="2"/>
<text x="170.0" y="256.4" text-anchor="middle" font-size="14" font-weight="700" fill="#22180F">Evidence</text>
<text x="170.0" y="275.4" text-anchor="middle" font-size="14" font-weight="400" fill="#22180F">a measurement or a playtest</text>
<path d="M 170 226 L 170 205" fill="none" stroke="#B5542A" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#a)"/>
<text x="330" y="330" text-anchor="middle" font-size="12" font-weight="400" fill="#22180F"></text>
<rect x="20" y="320" width="960" height="56" rx="12" fill="#FFFFFF" stroke="#8A6A3A" stroke-width="2"/>
<text x="500.0" y="352.9" text-anchor="middle" font-size="14" font-weight="700" fill="#22180F">Accepted when seen working on a screen, not when it compiles: 5 prototype bugs, zero found by reading code.</text>
</svg>
