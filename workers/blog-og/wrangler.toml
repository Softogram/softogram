name = "softogram-blog-og"
main = "worker.js"
compatibility_date = "2026-08-01"

# Attach a route for softogram.in/* in the Cloudflare dashboard (or via `routes` below
# once the zone is known). SITE_ORIGIN should be the current S3/CloudFront origin URL
# if the worker sits in front of DNS; otherwise the public SPA hostname.
[vars]
API_ORIGIN = "https://api.softogram.in"
SITE_ORIGIN = "https://softogram.in"
